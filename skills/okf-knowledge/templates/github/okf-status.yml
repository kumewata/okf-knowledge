# Copy to .github/workflows/okf-status.yml.
name: okf-status
on:
  schedule:
    - cron: "0 0 * * 1"  # Mondays 00:00 UTC
  workflow_dispatch:
jobs:
  okf-status:
    # Release tags never move. For the strongest pin, use the tag's commit SHA.
    uses: kumewata/okf-knowledge/.github/workflows/okf-status.yml@v1.0.1
    permissions:
      contents: read
      issues: write
    with:
      bundle: knowledge
