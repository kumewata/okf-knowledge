# Copy to .github/workflows/okf-lint.yml and make the job a required check.
# The bundle is knowledge/ here. For another directory, change both `paths`
# and `bundle`. For several bundles, list every bundle directory in `paths`
# (it filters the whole workflow) and add one job per bundle.
name: okf-lint
on:
  pull_request:
    paths: ["knowledge/**"]
jobs:
  okf-lint:
    # Release tags never move. For the strongest pin, use the tag's commit SHA.
    uses: kumewata/okf-knowledge/.github/workflows/okf-lint.yml@v1.0.6
    permissions:
      contents: read
      pull-requests: read
    with:
      bundle: knowledge
