# Copy to .github/workflows/okf-lint.yml and make the job a required check.
name: okf-lint
on:
  pull_request:
    paths: ["knowledge/**"]
jobs:
  okf-lint:
    # Release tags never move. For the strongest pin, use the tag's commit SHA.
    uses: kumewata/okf-knowledge/.github/workflows/okf-lint.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: read
    with:
      bundle: knowledge
