# Scan the full git history for secrets on pull requests and on pushes to
# the default branch. Install the MIT gitleaks CLI at a pinned release and
# check its published checksum. contents: read is enough; no license key.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow checkout would hide secrets in earlier commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          (
            cd "$RUNNER_TEMP"
            echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          )
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
